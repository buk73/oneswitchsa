<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Freelancer Opportunities | OneSwitch SA (Pty) Ltd</title>

  <meta name="description" content="Explore independent sales and customer referral opportunities with OneSwitch SA (Pty) Ltd. Apply to express your interest in our fibre referral programme.">

  <meta name="theme-color" content="#003366">

  <link rel="stylesheet" href="style.css">

  <style>
    .freelancer-container {
      max-width: 900px;
      margin: 0 auto;
    }

    .freelancer-form {
      background: #fff;
      padding: 24px;
      border: 1px solid #ddd;
      border-radius: 12px;
    }

    .freelancer-form label {
      display: block;
      margin: 16px 0 7px;
      font-weight: 600;
    }

    .freelancer-form input,
    .freelancer-form select,
    .freelancer-form textarea {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #b8c2cc;
      border-radius: 6px;
      font: inherit;
    }

    .freelancer-form textarea {
      min-height: 110px;
      resize: vertical;
    }

    .freelancer-form input[type="checkbox"] {
      display: inline-block;
      width: auto;
      margin-right: 8px;
    }

    .freelancer-form .consent-label {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-weight: 400;
      line-height: 1.5;
    }

    .freelancer-form .consent-label input {
      flex: 0 0 auto;
      margin-top: 5px;
    }

    .freelancer-form button {
      display: block;
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: 0;
      border-radius: 6px;
      background: #003366;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .freelancer-form input:focus,
    .freelancer-form select:focus,
    .freelancer-form textarea:focus,
    .freelancer-form button:focus {
      outline: 3px solid #8bbcff;
      outline-offset: 2px;
    }

    .opportunity-note {
      padding: 16px;
      margin: 20px 0;
      border-radius: 8px;
      background: #f1f5f9;
      line-height: 1.6;
    }
